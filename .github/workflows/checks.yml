# Automatic checks on every change: site (pages, accessibility, layout, security, pricing, owner
# tools), the Google Apps Script logic, and the Supabase database rules.
# Branches are checked through their pull request (once per commit); main is checked after each merge.
# main requires site-and-email and database to pass before a pull request can merge.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: tests/sql/run.sh
